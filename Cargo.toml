[workspace]
members = ["."]
resolver = "3"

[package]
name = "gst-moq"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0"
description = "Media over QUIC elements backed by MOQ5"
repository = "https://github.com/openmoq/moq5"

[lib]
name = "gstmoq"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
# Offline fixture inventory through the plugin splitter and the SDK parser.
name = "inspect_cmaf_fixture"
path = "src/bin/inspect_cmaf_fixture.rs"

[dependencies]
gst = { package = "gstreamer", version = "0.25", features = ["v1_22"] }
gst-base = { package = "gstreamer-base", version = "0.25", features = ["v1_22"] }
# The Rust bindings live in moq5 (bindings/rust); pinned to a commit.
moq5 = { git = "https://github.com/vitorgaz/moq5", rev = "20f6d9c885830d1cb6c44e186b797518c2cdf7db" }

[dev-dependencies]
# The fake-libmoq seam the unit tests install.
moq5 = { git = "https://github.com/vitorgaz/moq5", rev = "20f6d9c885830d1cb6c44e186b797518c2cdf7db", features = ["testing"] }

[profile.release]
lto = "thin"
